apiVersion: 1

providers:
  - name: "E-HealthCard Dashboards"
    orgId: 1
    folder: "E-HealthCard"
    folderUid: "ehealthcard"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
